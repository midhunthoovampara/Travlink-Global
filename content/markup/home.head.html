<style>
  .travlink-home .header-area-3 {
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    z-index: 50;
    background: transparent;
  }

  .travlink-home .header-area-3 .header-3 {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 24px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 999px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .travlink-home .header-area-3.stiky.scroll-header .header-3 {
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
  }

  .travlink-home .travlink-hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: #061523;
    isolation: isolate;
    padding: 140px 0 100px;
  }

  .travlink-home .travlink-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.46) 100%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.34) 100%);
    z-index: 0;
  }

  .travlink-home .travlink-hero__inner {
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .travlink-home .travlink-hero__content {
    max-width: 920px;
    margin: 0 auto;
    color: #fff;
    text-align: center;
    animation: travlinkFadeUp 900ms ease-out both;
    padding-top: 80px;
  }

  .travlink-home .travlink-hero__badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    padding: 7px 16px;
    margin-bottom: 24px;

    border-radius: 999px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.75);

    color: #1f2937;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;

    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .travlink-home .travlink-hero__badge-dot {
    width: 5px;
    height: 5px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #3b9eea;
    box-shadow: 0 0 0 3px rgba(59, 158, 234, 0.12);
  }

  .travlink-home .travlink-hero__title {
    color: #fff;
    font-size: clamp(3rem, 6vw, 4.5rem);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin: 0 auto;
    text-wrap: balance;
    text-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
  }
  .travlink-home .travlink-hero__title .title-white {
    color: #ffffff;
  }

  .travlink-home .travlink-hero__title .title-blue {
    color: #4da3ff; /* Change to your preferred blue */
  }

  .travlink-home .travlink-hero__copy {
    max-width: 760px;
    margin: 22px auto 0;
    color: rgba(255, 255, 255, 0.92);
    font-size: clamp(1.02rem, 1.6vw, 1.2rem);
    line-height: 1.8;
    text-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
  }

  .travlink-home .travlink-hero__actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 34px;
  }

  .travlink-home .ca-btn-primary-3 {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    padding: 10px 30px;
    min-height: 56px;

    border-radius: 999px;
    border: none;

    background: linear-gradient(135deg, rgba(45, 127, 249, 0.35));
    color: #fff !important;

    font-size: 15px;
    font-weight: 600;

    box-shadow: 0 15px 35px rgba(45, 127, 249, 0.35);
    transition: all 0.35s ease;
  }

  .travlink-home .ca-btn-primary-3:hover {
    transform: translateY(-3px);
    box-shadow: 0 22px 45px rgba(45, 127, 249, 0.45);
    color: #fff;
  }

  .travlink-home .travlink-hero__actions .travlink-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 28px;
    min-height: 54px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: 220ms ease;
  }

  .travlink-home .travlink-hero__actions .travlink-secondary:hover {
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-1px);
  }

  .travlink-home .travlink-hero__actions .ca-btn-primary-3 span,
  .travlink-home .travlink-hero__actions .travlink-secondary span {
    margin-left: 10px;
  }

  .travlink-home .travlink-blue-shade {
    background:
      radial-gradient(
        circle at 8% 24%,
        rgba(63, 169, 225, 0.2) 0,
        rgba(63, 169, 225, 0) 40%
      ),
      radial-gradient(
        circle at 92% 72%,
        rgba(88, 181, 229, 0.14) 0,
        rgba(88, 181, 229, 0) 42%
      ),
      linear-gradient(
        180deg,
        #ffffff 0%,
        #f4faff 11%,
        #e8f5fc 48%,
        #f3faff 88%,
        #ffffff 100%
      );
  }

  .travlink-home .travlink-process {
    border-top: 0;
    border-bottom: 0;
    background-image:
      linear-gradient(180deg, rgba(3, 13, 27, 0.74), rgba(3, 17, 34, 0.82)),
      url("/img/process/travlink-process-premium.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
  }

  .travlink-home .travlink-process__header .ca-section-subtitle {
    color: #a9d6ff;
  }

  .travlink-home .travlink-process__header .ca-section-title,
  .travlink-home .travlink-process__header .ca-section-title em,
  .travlink-home .travlink-process__step h3 {
    color: #ffffff;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.34);
  }

  .travlink-home .travlink-process__grid::before {
    background: rgba(255, 255, 255, 0.3);
  }

  .travlink-home .travlink-process__number {
    color: #ffffff;
    background: rgba(7, 24, 45, 0.58);
    border-color: rgba(255, 255, 255, 0.46);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .travlink-home .travlink-process__step:hover .travlink-process__number,
  .travlink-home .travlink-process__step:hover h3 {
    color: #a9d6ff;
    border-color: rgba(169, 214, 255, 0.8);
  }

  @media (max-width: 767px) {
    .travlink-home .travlink-process {
      background-position: 70% center;
    }
  }

  .travlink-home main > section {
    background-clip: padding-box;
  }

  .travlink-home .travlink-white-section {
    background: #ffffff;
  }

  @keyframes travlinkFadeUp {
    from {
      opacity: 0;
      transform: translateY(28px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 991px) {
    .travlink-home .header-area-3 {
      position: absolute;
      top: 16px;
    }

    .travlink-home .header-area-3 .header-3 {
      border-radius: 28px;
      padding: 12px 18px;
    }

    .travlink-home .travlink-hero {
      min-height: 92vh;
      padding: 120px 0 80px;
    }

    .travlink-home .travlink-hero__content {
      max-width: 920px;
    }
  }

  @media (max-width: 767px) {
    .travlink-home .travlink-hero {
      min-height: 90vh;
      padding: 110px 0 64px;
    }

    .travlink-home .travlink-hero__title {
      font-size: clamp(2.2rem, 11vw, 3rem);
    }

    .travlink-home .travlink-hero__copy {
      margin-top: 18px;
    }

    .travlink-home .travlink-hero__actions {
      gap: 12px;
    }
  }
</style>
